<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#16213e">
    <link rel="manifest" href="/trading-tracker/manifest.json">
    <link rel="apple-touch-icon" href="/trading-tracker/icons/icon-192.png">
    <title>Trading Tracker</title>
    <link rel="stylesheet" href="/trading-tracker/style.css">
</head>
<body>
    <div id="app">
        <header>
            <button id="prevMonth">&lt;</button>
            <h1 id="monthYear"></h1>
            <button id="nextMonth">&gt;</button>
        </header>

        <div class="weekdays">
            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span>
        </div>

        <div id="calendar" class="calendar-grid"></div>

        <div class="actions">
            <button id="btnBalance" class="btn-primary">Ver Balance Mensual</button>
            <button id="btnExport" class="btn-secondary">Descargar Excel</button>
        </div>
    </div>

    <!-- Modal para registrar día -->
    <div id="modalEntry" class="modal">
        <div class="modal-content">
            <h2 id="modalDate"></h2>
            <p>Selecciona el resultado:</p>
            <div class="choice-buttons">
                <button id="btnProfit" class="btn-profit">📈 GANANCIA</button>
                <button id="btnLoss" class="btn-loss">📉 PÉRDIDA</button>
            </div>
            <div id="amountSection" class="hidden">
                <label>€ <input type="number" id="amountInput" step="0.01" placeholder="0.00"></label>
                <button id="btnSave" class="btn-save">Guardar</button>
            </div>
            <button id="btnDelete" class="btn-delete hidden">Eliminar Registro</button>
            <button id="btnCloseModal" class="btn-close">Cerrar</button>
        </div>
    </div>

    <!-- Modal para balance -->
    <div id="modalBalance" class="modal">
        <div class="modal-content">
            <h2>Balance Mensual</h2>
            <div id="balanceContent"></div>
            <button id="btnCloseBalance" class="btn-close">Cerrar</button>
        </div>
    </div>

    <script src="/trading-tracker/app.js"></script>
</body>
</html>
